AWSTemplateFormatVersion: '2010-09-09'
Description: Instalação e configuração do Apache na EC2

Resources:
  ApacheConfig:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0ed9277fb7eb570c9
      InstanceType: t2.micro
      SecurityGroups:
        - !ImportValue Firewall-SG
      Tags:
        - Key: Name
          Value: ApacheServer
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum update -y
          yum install -y httpd.x86_64
          systemctl start httpd.service
          systemctl enable httpd.service
          echo "<h1>Servidor Apache via CloudFormation 🚀</h1>" > /var/www/html/index.html
